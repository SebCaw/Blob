<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Not found — Blob</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/icons/blob.svg" />
  </head>
  <body>
    <!--
      Only ever reached by a request for a FILE that does not exist - see the
      note in `staticHandler`. Anything that looks like a deep link into the app
      still opens the app, because "/join/4827" is a route rather than a missing
      page and a 404 there would be a lie.

      Deliberately not a screen inside the app: this has to render when the app
      itself is what could not be found.
    -->
    <main class="legal legal--404">
      <h1 class="legal__title">Nothing here</h1>
      <p class="legal__lede">
        That address does not exist. It was probably mistyped, or it is a link to something that
        has since moved.
      </p>
      <p>
        If you were trying to join a game, you do not need a special link — open Blob, tap
        <strong>Join a game</strong>, and type in the four-digit code.
      </p>
      <p class="legal__back" style="margin-top: 28px">
        <a href="/">&lsaquo; Back to Blob</a>
      </p>
    </main>
  </body>
</html>
